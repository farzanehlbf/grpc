syntax = "proto3";

package ping.dto;

option php_namespace = "GRPC\\Ping";
option php_metadata_namespace = "GRPC\\Ping\\GPBMetadata";

import "google/protobuf/timestamp.proto";

message PingRequest {
    string url = 1;
}
message PingResponse
{
    int32 status = 1;
    google.protobuf. Timestamp created_at = 2;
}
